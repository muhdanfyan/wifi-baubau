<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="description" content="Error Hotspot - Wifi Baubau">
    <meta name="author" content="Kota Baubau">
    <link rel="stylesheet" type="text/css" href="assets/fonts/fonts.css"> 
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
    <title>Kesalahan Koneksi - Wifi Baubau</title>
</head>
<body>

    <div class="split-card">
        <!-- Visual Section -->
        <div class="visual-side">
            <img src="assets/img/baubau40.png" alt="BAUBAU 4.0" class="hero-img">
        </div>
        
        <!-- Error Message Section -->
        <div class="form-side" style="justify-content: center; text-align: center;">
            <div class="branding" style="justify-content: center;">
                <img src="assets/img/logo-baubau.png" alt="Logo Kota Baubau">
                <span>Kota Baubau</span>
            </div>
            
            <div class="status-indicator" style="background: #fff5f5; color: #e53e3e;">Terjadi Kesalahan</div>
            
            <h2 style="font-size: 20px;">Hotspot Error</h2>
            <p class="instruction" style="color: #e53e3e; font-weight: 600; margin-top: 10px;">$(error)</p>
            
            <div class="error-details" style="background: #f8f9fa; padding: 20px; border-radius: 12px; margin: 30px 0; border: 1px dashed #ddd;">
                <p style="font-size: 13px; color: var(--text-muted);">Pastikan data login Anda benar atau hubungi administrator jika masalah berlanjut.</p>
            </div>

            <button type="button" class="btn-send" onclick="window.location.href='$(link-login)'">Kembali ke Login</button>
            
            <div class="back-link" style="margin-top: 40px;">
                <p style="font-size: 11px; color: #aaa;">&copy; 2026 Pemerintah Kota Baubau</p>
            </div>
        </div>
    </div>

</body>
</html>
