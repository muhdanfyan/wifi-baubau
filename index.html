<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hotspot Login Kota Baubau">
    <meta name="author" content="Kota Baubau">
    <link rel="stylesheet" type="text/css" href="assets/fonts/fonts.css"> 
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
    <title>Hotspot Login - Kota Baubau</title>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="assets/img/logo-baubau.png" alt="Logo Kota Baubau">
        </div>
        
        <h1>Free Wi-Fi</h1>
        <p class="subtitle">Selamat Datang di Hotspot Kota Baubau</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" class="form-control" placeholder="Masukkan nama lengkap Anda" required>
            </div>
            
            <div class="form-group">
                <label for="wa">Nomor WhatsApp</label>
                <input type="tel" id="wa" name="wa" class="form-control" placeholder="Contoh: 08123456789" required>
            </div>
            
            <div class="form-group">
                <label for="saran">Saran / Pertanyaan</label>
                <textarea id="saran" name="saran" class="form-control" placeholder="Tuliskan saran atau pertanyaan Anda untuk Kota Baubau"></textarea>
            </div>
            
            <button type="submit" class="btn-connect">Hubungkan Sekarang</button>
        </form>
        
        <div class="footer-links">
            <p>Dengan menghubungkan, Anda menyetujui <a href="#">Syarat & Ketentuan</a></p>
            <p>Butuh bantuan? Hubungi <a href="#">Pusat Layanan</a></p>
        </div>
    </div>

</body>
</html>
